[package]
name = "poe2-sync-companion"
version = "0.1.0"
description = "Path of Exile 2 Build Tracking Companion"
authors = ["you"]
license = "MIT"
repository = "https://github.com/yourrepo/poe2-sync-companion"
default-run = "poe2-sync-companion"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "poe2-sync-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri   = { version = "1.5.0", features = ["shell-open", "fs-read-file", "dialog-open", "http-all"] }
serde   = { version = "1.0",   features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic   = "abort"     # Cuts binary size
codegen-units = 1     # Maximizes optimization
lto     = true        # Full LTO for minimal binary
opt-level = "s"       # Optimize for size
strip   = true        # Strip debug symbols
